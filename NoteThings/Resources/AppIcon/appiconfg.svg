<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(228, 228)">
        <!-- Ears -->
        <path d="M -55 -90 L -45 -135 L -20 -100 Z" fill="#ffffff"/>
        <path d="M 55 -90 L 45 -135 L 20 -100 Z" fill="#ffffff"/>
        <!-- Inner ears -->
        <path d="M -47 -100 L -42 -120 L -32 -103 Z" fill="#f5b6b6"/>
        <path d="M 47 -100 L 42 -120 L 32 -103 Z" fill="#f5b6b6"/>

        <!-- Head -->
        <ellipse cx="0" cy="-15" rx="85" ry="105" fill="#ffffff"/>

        <!-- Snout -->
        <ellipse cx="0" cy="50" rx="42" ry="32" fill="#e8d5b7"/>

        <!-- Glasses frames -->
        <circle cx="-30" cy="-35" r="26" fill="#ffffff" stroke="#1e1e1e" stroke-width="6"/>
        <circle cx="30" cy="-35" r="26" fill="#ffffff" stroke="#1e1e1e" stroke-width="6"/>
        <line x1="-4" y1="-35" x2="4" y2="-35" stroke="#1e1e1e" stroke-width="6" stroke-linecap="round"/>

        <!-- Eyes -->
        <circle cx="-30" cy="-35" r="6" fill="#1e1e1e"/>
        <circle cx="30" cy="-35" r="6" fill="#1e1e1e"/>

        <!-- Nostrils -->
        <ellipse cx="-13" cy="48" rx="4" ry="6" fill="#1e1e1e"/>
        <ellipse cx="13" cy="48" rx="4" ry="6" fill="#1e1e1e"/>

        <!-- Mouth -->
        <path d="M -12 70 Q 0 78 12 70" stroke="#1e1e1e" stroke-width="4" fill="none" stroke-linecap="round"/>

        <!-- Forelock (mane tuft on forehead) -->
        <path d="M -25 -108 Q -10 -135 0 -115 Q 10 -135 25 -108 Q 5 -100 -25 -108 Z" fill="#3a2820"/>
